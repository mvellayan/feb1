services:
  ib-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ib-gateway
    restart: "no"            # shut down daily; don't auto-restart

    env_file:
      - .env                 # TWS_USERID, TWS_PASSWORD, TRADING_MODE

    ports:
      # arbo701.py connects to 127.0.0.1:7497.
      # IB Gateway paper trading listens on 4002 inside the container.
      # Docker maps host:7497 → container:4002 transparently — no code changes needed.
      - "127.0.0.1:7497:4002"

    volumes:
      # Persist Gateway settings (API config, login state) across daily restarts
      - ibgateway-jts:/root/Jts

    shm_size: "256m"         # Java GUI apps need extra shared memory

    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/4002'"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s     # IBC login takes ~60-90 s on first start

volumes:
  ibgateway-jts:
